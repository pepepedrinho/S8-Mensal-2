name: triodelicia_usage_event_count
description: Contagem de eventos de negocio (todo_listed/created/completed/deleted) por tipo.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="triodelicia-backend"
  AND (jsonPayload.event="todo_listed" OR jsonPayload.event="todo_created"
       OR jsonPayload.event="todo_completed" OR jsonPayload.event="todo_deleted")
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: event
      valueType: STRING
labelExtractors:
  event: EXTRACT(jsonPayload.event)
