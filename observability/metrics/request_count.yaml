name: triodelicia_request_count
description: Contagem de requisicoes HTTP concluidas no backend (por rota e status).
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="triodelicia-backend"
  AND jsonPayload.event="http_request"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: route
      valueType: STRING
    - key: status_code
      valueType: STRING
labelExtractors:
  route: EXTRACT(jsonPayload.route)
  status_code: EXTRACT(jsonPayload.status_code)
